[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
linker = "aarch64-none-elf-gcc"
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-args=-static -ffreestanding -nostdlib -mgeneral-regs-only -Wl,--build-id=none"
]
runner = "qemu-system-aarch64 -s -S -M virt,virtualization=on -cpu cortex-a76 -smp 4 -m 4G -nographic -kernel"

[unstable]
build-std = ["core"]
